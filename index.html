<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Varshini Crackers</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>🎆 VARSHINI CRACKERS 🎆</h1>
    <p>Wholesale Sivakasi Crackers Online Store</p>
</header>

<section class="hero">
    <h2>Celebrate More, Save More!</h2>
    <p>Quality Crackers at Wholesale Prices</p>
</section>

<main>

<h2 class="section-title">Our Products</h2>

<div id="productList" class="product-grid"></div>

<section class="cart-section">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems">
        <p class="empty-cart">Your cart is empty</p>
    </div>

    <div class="cart-total">
        <strong>Total Amount:</strong>
        ₹<span id="cartTotal">0</span>
    </div>

</section>

<section class="customer-section">

    <h2>📦 Customer Details</h2>

    <input
        type="text"
        id="customerName"
        placeholder="Customer Name"
    >

    <input
        type="tel"
        id="customerPhone"
        placeholder="Mobile Number"
    >

    <input
        type="email"
        id="customerEmail"
        placeholder="Email Address"
    >

    <textarea
        id="customerAddress"
        placeholder="Delivery Address"
        rows="4"
    ></textarea>

    <input
        type="text"
        id="customerPincode"
        placeholder="Pincode"
    >

    <h3>Payment Method</h3>

    <label class="payment-option">
        <input type="radio" name="payment" value="Cash on Delivery" checked>
        Cash on Delivery
    </label>

    <button class="whatsapp-btn" onclick="sendWhatsAppOrder()">
        📲 Submit Order on WhatsApp
    </button>

</section>

</main>

<footer>
    <p>© 2026 Varshini Crackers</p>
    <p>Wholesale Crackers | Sivakasi</p>
</footer>

<script src="script.js"></script>

</body>
</html>
