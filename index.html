<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VARSHINI CRACKERS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #222;
}

.header {
    text-align: center;
    padding: 15px 10px 8px;
    border-bottom: 1px solid #ddd;
}

.logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    display: block;
    margin: 0 auto 5px;
}

.brand {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
    line-height: 1.05;
}

.subtitle {
    margin: 6px 0 0;
    font-size: 14px;
}

.offer-title {
    text-align: center;
    margin: 18px 10px 5px;
    font-size: 22px;
}

.offer-text {
    text-align: center;
    margin: 0 10px 18px;
    font-size: 14px;
}

/* Product card */
.product-card {
    width: 92%;
    max-width: 430px;
    margin: 0 auto 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.serial {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

/* Image size fixed */
.product-image {
    width: 100%;
    height: 240px;
    object-fit: contain;
    display: block;
    margin: auto;
    border-radius: 8px;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    margin: 12px 0 5px;
}

.price {
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    margin: 5px 0 12px;
}

/* Large visible button */
.view-button {
    display: block;
    width: 90%;
    margin: 0 auto;
    padding: 13px 10px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
}

@media (min-width: 700px) {
    .product-card {
        max-width: 500px;
    }

    .product-image {
        height: 300px;
    }
}
</style>
</head>

<body>

<header class="header">

    <!-- உங்கள் logo file name-ஐ இங்கே மாற்றவும் -->
    <img src="logo.png" class="logo" alt="Varshini Crackers Logo">

    <h1 class="brand">VARSHINI<br>CRACKERS</h1>

    <p class="subtitle">
        Wholesale Product Catalogue
    </p>

</header>

<h2 class="offer-title">
    2026 Special Offer Price List
</h2>

<p class="offer-text">
    Best Quality • Best Discount • Fast Delivery
</p>

<div class="product-card">

    <div class="serial">1</div>

    <!-- உங்கள் product image -->
    <img
        src="product1.jpg"
        class="product-image"
        alt="Product"
    >

    <div class="product-name">
        Flower Pot
    </div>

    <div class="price">
        ₹120
    </div>

    <div class="view-button">
        View Product
    </div>

</div>

</body>
</html>
